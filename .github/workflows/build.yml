name: Native builds and staged release

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag whose release should receive the native binaries
        required: true
        default: v0.9.5

permissions:
  contents: read
  actions: read

concurrency:
  group: native-release-${{ github.event_name == 'pull_request' && github.ref || inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
  LOGISTH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  started:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Record build start
        env:
          REPORT_PHASE: building
        run: python3 scripts/write_ci_status.py

  plugins:
    name: Build ${{ matrix.platform }}
    timeout-minutes: 45
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
            parallel: 2
          - os: windows-2022
            platform: windows-x86_64
            parallel: 2
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxext-dev libxinerama-dev libxrandr-dev libxcursor-dev libfreetype6-dev libfontconfig1-dev libgl1-mesa-dev
      - name: Verify upstream algorithm identities
        run: python scripts/audit_algorithms.py
      - name: Verify bundled themes and fonts
        run: python scripts/verify_theme_assets.py
      - name: Verify release publisher regressions
        run: python -m unittest discover -s scripts/tests
      - name: Build, test, verify architecture and package
        run: python scripts/build_native.py --platform ${{ matrix.platform }} --output native-out --parallel ${{ matrix.parallel }} --reuse
      - name: Retain binaries and diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: native-out/
          if-no-files-found: error
          retention-days: 14
      - name: Record native platform result
        if: always() && github.event_name != 'pull_request'
        env:
          REPORT_PLATFORM: ${{ matrix.platform }}
          REPORT_PHASE: ${{ job.status == 'success' && 'passed' || 'failed' }}
        run: python scripts/write_ci_status.py

  windows_asan:
    name: Windows AddressSanitizer regression
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
      - name: Locate the MSVC AddressSanitizer runtime
        shell: pwsh
        run: |
          $compilerRoot = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $runtime = Get-ChildItem "$compilerRoot\VC\Tools\MSVC\*\bin\Hostx64\x64\clang_rt.asan_dynamic-x86_64.dll" | Select-Object -Last 1
          if (-not $runtime) { throw "MSVC AddressSanitizer runtime not installed" }
          $runtime.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build and run native memory regressions
        env:
          CXXFLAGS: /fsanitize=address /Zi
          LDFLAGS: /INCREMENTAL:NO /DEBUG
        run: python scripts/build_native.py --platform windows-x86_64 --output native-out --parallel 2
      - name: Retain memory diagnostics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-windows-asan-logs
          path: native-out/logs/
          if-no-files-found: error
          retention-days: 14
      - name: Record memory regression result separately
        if: always() && github.event_name != 'pull_request'
        env:
          REPORT_PLATFORM: windows-x86_64
          REPORT_CHECK: windows-asan
          REPORT_PHASE: ${{ job.status == 'success' && 'passed' || 'failed' }}
        run: python scripts/write_ci_status.py

  publish:
    name: Publish Windows and Linux
    if: github.event_name != 'pull_request'
    needs: [plugins, windows_asan]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: ci-artifacts
      - name: Publish both tested platforms before starting macOS
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_native_release.py --tag "$RELEASE_TAG" --artifacts ci-artifacts --platforms linux-x86_64 windows-x86_64 --result native-release-result.json
      - uses: actions/upload-artifact@v4
        with:
          name: native-release-receipt-windows-linux
          path: native-release-result.json
          if-no-files-found: error

  report_initial:
    name: Report available Windows and Linux downloads
    if: always() && github.event_name != 'pull_request'
    needs: [started, plugins, windows_asan, publish]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: ci-artifacts
      - name: Locate first publication receipt
        if: needs.publish.result == 'success'
        run: cp ci-artifacts/native-release-receipt-windows-linux/native-release-result.json native-release-result.json
      - name: Record first publication
        env:
          REPORT_PHASE: ${{ needs.publish.result == 'success' && 'published' || 'failed' }}
          REPORT_STAGE: windows-linux
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/write_ci_status.py

  macos:
    name: Build macos-universal after first publication
    needs: [plugins, publish]
    if: always() && ((github.event_name == 'pull_request' && needs.plugins.result == 'success') || (github.event_name != 'pull_request' && needs.publish.result == 'success'))
    runs-on: macos-15-intel
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
      - name: Verify upstream algorithm identities
        run: python3 scripts/audit_algorithms.py
      - name: Verify bundled themes and fonts
        run: python3 scripts/verify_theme_assets.py
      - name: Verify bundled themes and fonts
        run: python scripts/verify_theme_assets.py
      - name: Verify release publisher regressions
        run: python3 -m unittest discover -s scripts/tests
      - name: Build, test, verify both architectures and package
        run: python3 scripts/build_native.py --platform macos-universal --output native-out --parallel 4 --reuse
      - name: Retain binaries and diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-macos-universal
          path: native-out/
          if-no-files-found: error
          retention-days: 14
      - name: Record macOS result
        if: always() && github.event_name != 'pull_request'
        env:
          REPORT_PLATFORM: macos-universal
          REPORT_PHASE: ${{ job.status == 'success' && 'passed' || 'failed' }}
        run: python3 scripts/write_ci_status.py

  publish_macos:
    name: Add macOS to the existing release
    if: github.event_name != 'pull_request'
    needs: [publish, macos]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: native-macos-universal
          path: ci-artifacts/native-macos-universal
      - name: Preserve Windows/Linux and append verified macOS files
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_native_release.py --tag "$RELEASE_TAG" --artifacts ci-artifacts --platforms macos-universal --result native-release-result.json
      - uses: actions/upload-artifact@v4
        with:
          name: native-release-receipt-complete
          path: native-release-result.json
          if-no-files-found: error

  report_final:
    name: Report complete release or pending macOS
    if: always() && github.event_name != 'pull_request'
    needs: [started, plugins, windows_asan, publish, report_initial, macos, publish_macos]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: ci-artifacts
      - name: Locate complete publication receipt
        if: needs.publish_macos.result == 'success'
        run: cp ci-artifacts/native-release-receipt-complete/native-release-result.json native-release-result.json
      - name: Keep first-stage downloads available if macOS fails
        if: needs.publish.result == 'success' && needs.publish_macos.result != 'success'
        run: cp ci-artifacts/native-release-receipt-windows-linux/native-release-result.json native-release-result.json
      - name: Record final result and verified links
        env:
          REPORT_PHASE: ${{ needs.publish_macos.result == 'success' && 'published' || (needs.publish.result == 'success' && 'macos-failed' || 'failed') }}
          REPORT_STAGE: final
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/write_ci_status.py
