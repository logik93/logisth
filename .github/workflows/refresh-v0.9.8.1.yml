name: Refresh unpublished v0.9.8.1 build
on:
  push:
    branches: [master]
    paths: ['.github/workflows/refresh-v0.9.8.1.yml']
permissions:
  contents: read
  actions: write
jobs:
  stop_unpublished_build:
    runs-on: ubuntu-22.04
    steps:
      - name: Stop only the superseded, unpublished build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          base='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          try:
              with urlopen(Request(base+'/releases/tags/v0.9.8.1',headers=headers)) as response:
                  raise SystemExit('Refusing to refresh an already published release')
          except HTTPError as error:
              if error.code != 404: raise
          url=base+'/actions/runs/44171617882'
          with urlopen(Request(url,headers=headers)) as response: run=json.load(response)
          assert run['head_sha']=='c08ff75a934a7f364bb07001b21c1098109b858a'
          assert run['head_branch']=='v0.9.8.1' and run['event']=='push'
          if run['status']!='completed':
              with urlopen(Request(url+'/cancel',headers=headers,method='POST')) as response:
                  assert response.status==202
          print('Superseded unpublished build cancellation requested')
          PY
