name: Read native test diagnostics
on:
  push:
    branches: [ci-diagnostics-0.9.3]
permissions:
  contents: write
  actions: read
jobs:
  diagnostics:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.9.3
      - uses: actions/download-artifact@v4
        with:
          name: native-windows-x86_64
          run-id: 43647870669
          github-token: ${{ github.token }}
          path: native-out
      - name: Report failing test details
        env:
          RELEASE_TAG: v0.9.3
          REPORT_PLATFORM: windows-x86_64
          REPORT_PHASE: failed
          LOGISTH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = ET.parse('native-out/logs/test-results.xml').getroot()
          failures = []
          for test in root.iter('testcase'):
              if test.find('failure') is not None or test.find('error') is not None:
                  failures.append({'test': test.attrib, 'xml': ET.tostring(test,encoding='unicode')[-18000:]})
          Path('native-release-result.json').write_text(json.dumps({'diagnostic_tests':root.attrib,'diagnostic_failures':failures,'diagnostic_log':Path('native-out/logs/tests.log').read_text()[-22000:]}))
          PY
          python3 scripts/write_ci_status.py
