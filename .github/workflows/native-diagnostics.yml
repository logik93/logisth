name: Diagnose native Windows integration crash
on:
  push:
    branches: [ci-diagnostics-0.9.3]
permissions:
  contents: write
  actions: read
jobs:
  diagnostics:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 451a8e7f98e660ee338e0f733d3946c9ed565964
          fetch-depth: 0
      - name: Add diagnostic breadcrumbs to the test runner
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          p=Path('tests/ProcessorTests.cpp')
          s=p.read_text(encoding='utf-8')
          s=s.replace('int main(int argc, char **argv) {','int main(int argc, char **argv) {\n    std::cout << std::unitbuf; std::cerr << std::unitbuf;')
          prefix, main=s.split('int main(',1)
          main=re.sub(r'^(        )((?:\w+_test::run|check\w+)\([^;\n]*\);)$',lambda m:m[1]+'std::cout << "ENTER '+m[2].replace('"','')+'\\n";\n'+m[0],main,flags=re.M)
          s=prefix+'int main('+main
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/ProcessorTests.cpp
          git commit -m "Local Windows crash instrumentation"
      - name: Make the MSVC sanitizer runtime available to build tools
        shell: pwsh
        run: |
          $compilerRoot = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $runtime = Get-ChildItem "$compilerRoot\VC\Tools\MSVC\*\bin\Hostx64\x64\clang_rt.asan_dynamic-x86_64.dll" | Select-Object -Last 1
          if (-not $runtime) { throw "MSVC AddressSanitizer runtime not installed" }
          $runtime.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build with native address diagnostics
        env:
          CXXFLAGS: /fsanitize=address /Zi
          LDFLAGS: /INCREMENTAL:NO /DEBUG
          LOGISTH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/build_native.py --platform windows-x86_64 --output native-out --parallel 2
      - name: Report test and sanitizer diagnostics
        if: always()
        shell: bash
        env:
          RELEASE_TAG: v0.9.3
          REPORT_PLATFORM: windows-x86_64
          REPORT_PHASE: failed
          LOGISTH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import xml.etree.ElementTree as ET
          failures=[]
          results=Path('native-out/logs/test-results.xml')
          if results.exists():
              root=ET.parse(results).getroot()
              for test in root.iter('testcase'):
                  if test.find('failure') is not None or test.find('error') is not None:
                      failures.append({'test':test.attrib,'xml':ET.tostring(test,encoding='unicode')[-22000:]})
          logs={p.name:p.read_text(errors='replace')[-25000:] for p in Path('native-out/logs').glob('*.log') if p.name in ['tests.log','build.log','configure.log']}
          Path('native-release-result.json').write_text(json.dumps({'diagnostic_failures':failures,'diagnostic_logs':logs}))
          PY
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/write_ci_status.py')
          s=p.read_text().replace("branch = ('ci-build-' + tag + '-' + platform) if platform else ('ci-release-' + tag)", "branch = 'ci-diagnostic-v0.9.3-windows-x86_64'")
          p.write_text(s)
          PY
          python scripts/write_ci_status.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-crash-diagnostics
          path: native-out/logs
